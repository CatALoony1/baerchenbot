name: CD - Deploy to Oracle Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploybot
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Repository klonen, falls es noch nicht existiert
            if [ ! -d "~/baerchenbot" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git ~/baerchenbot
            fi

            cd ~/baerchenbot

            # 2. Neuesten Code erzwingen und lokale Änderungen verwerfen
            git fetch origin main
            git reset --hard origin/main

            # 3. .env Datei frisch aus den GitHub Secrets generieren
            echo "TOKEN=${{ secrets.TOKEN }}" > .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "AI_API=${{ secrets.AI_API }}" >> .env
            echo "CAT_API=${{ secrets.CAT_API }}" >> .env
            echo "DOG_API=${{ secrets.DOG_API }}" >> .env
            echo "GIPHY_API=${{ secrets.GIPHY_API }}" >> .env
            echo "HERO_API=${{ secrets.HERO_API }}" >> .env
            echo "SPOONACULAR_API=${{ secrets.SPOONACULAR_API }}" >> .env

            # 4. Docker-Image neu bauen
            docker build -t baerchenbot-live .

            # 5. Alten Container stoppen und löschen (Fehler ignorieren beim allerersten Start)
            docker stop baerchenbot-container || true
            docker rm baerchenbot-container || true

            # 6. Neuen Container mit der .env Datei starten
            docker run -d \
              --name baerchenbot-container \
              --network="host" \
              --restart unless-stopped \
              --env-file .env \
              baerchenbot-live
