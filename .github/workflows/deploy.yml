name: CD - Deploy to Oracle Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploybot
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            TARGET_DIR="$HOME/baerchenbot-dev"

            # 1. Repository klonen, falls noch nicht vorhanden
            if [ ! -d "$TARGET_DIR" ]; then
              git clone -b develop ${{ github.server_url }}/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # 2. Neuesten Code erzwingen und lokale Änderungen verwerfen
            git fetch origin main
            git reset --hard origin/main

            # 3. .env Datei sauber aus den GitHub Secrets schreiben
            # 'EOF' in Anführungszeichen verhindert jegliches SSH/Shell-Parsing von Sonderzeichen
            cat << 'EOF' > .env
            TOKEN=${{ secrets.TOKEN }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            WEBSECRET=${{ secrets.WEBSECRET }}
            AI_API=${{ secrets.AI_API }}
            CAT_API=${{ secrets.CAT_API }}
            DOG_API=${{ secrets.DOG_API }}
            GIPHY_API=${{ secrets.GIPHY_API }}
            HERO_API=${{ secrets.HERO_API }}
            SPOONACULAR_API=${{ secrets.SPOONACULAR_API }}
            CLIENT_ID=${{ secrets.CLIENT_ID }}
            ADMIN_ID=${{ secrets.ADMIN_ID }}
            EOF

            # 4. Docker-Image neu bauen
            docker build -t baerchenbot-live .

            # 5. Alten Container stoppen und löschen (Fehler ignorieren beim allerersten Start)
            docker stop baerchenbot-container || true
            docker rm baerchenbot-container || true

            # 6. Neuen Container mit der .env Datei starten
            docker run -d \
              --name baerchenbot-container \
              --network="host" \
              --restart unless-stopped \
              --env-file .env \
              baerchenbot-live
