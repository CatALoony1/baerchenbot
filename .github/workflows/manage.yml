name: CD - Manage Container (Manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Welche Aktion soll ausgeführt werden?'
        required: true
        default: 'stop'
        type: choice
        options:
          - stop
          - start
          - restart

jobs:
  manage-container:
    runs-on: ubuntu-latest

    steps:
      - name: Manage Container via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploybot
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            ACTION="${{ inputs.action }}"
            echo "Führe '$ACTION' für baerchenbot-container aus..."

            if [ "$ACTION" = "stop" ]; then
              docker stop baerchenbot-container || true
            elif [ "$ACTION" = "start" ]; then
              docker start baerchenbot-container
            elif [ "$ACTION" = "restart" ]; then
              docker restart baerchenbot-container
            fi
