name: CD - Deploy to Oracle Server (DEV)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: devdeploy
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            TARGET_DIR="$HOME/baerchenbot-dev"

            # 1. Repository klonen, falls noch nicht vorhanden
            if [ ! -d "$TARGET_DIR" ]; then
              git clone -b develop ${{ github.server_url }}/${{ github.repository }}.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # 2. Neuesten Code erzwingen
            git fetch origin develop
            git reset --hard origin/develop

            # 3. .env Datei sauber aus den GitHub Secrets schreiben
            # 'EOF' in Anführungszeichen verhindert jegliches SSH/Shell-Parsing von Sonderzeichen
            cat << 'EOF' > .env
            TOKEN=${{ secrets.DEV_TOKEN }}
            MONGODB_URI=${{ secrets.MONGODB_DEV }}
            WEBSECRET=${{ secrets.WEBSECRET }}
            AI_API=${{ secrets.AI_API }}
            CAT_API=${{ secrets.CAT_API }}
            DOG_API=${{ secrets.DOG_API }}
            GIPHY_API=${{ secrets.GIPHY_API }}
            HERO_API=${{ secrets.HERO_API }}
            SPOONACULAR_API=${{ secrets.SPOONACULAR_API }}
            CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}
            ADMIN_ID=${{ secrets.ADMIN_ID }}
            EOF

            # 4. Docker-Image bauen
            docker build -t baerchenbot-dev-image .

            # 5. Alten Dev-Container stoppen und löschen
            docker stop baerchenbot-dev-container || true
            docker rm baerchenbot-dev-container || true

            # 6. Neuen Dev-Container starten
            docker run -d \
              --name baerchenbot-dev-container \
              --network="host" \
              --restart unless-stopped \
              --env-file .env \
              baerchenbot-dev-image
