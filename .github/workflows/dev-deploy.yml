name: CD - Deploy to Oracle Server (DEV)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: devdeploy
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Repository klonen (direkt den develop-Branch)
            if [ ! -d "~/baerchenbot-dev" ]; then
              git clone -b develop ${{ github.server_url }}/${{ github.repository }}.git ~/baerchenbot-dev
            fi

            cd ~/baerchenbot-dev

            # 2. Neuesten Code vom develop-Branch erzwingen
            git fetch origin develop
            git reset --hard origin/develop

            # 3. .env Datei mit dem DEV_TOKEN generieren
            echo "TOKEN=${{ secrets.DEV_TOKEN }}" > .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "AI_API=${{ secrets.AI_API }}" >> .env
            echo "CAT_API=${{ secrets.CAT_API }}" >> .env
            echo "DOG_API=${{ secrets.DOG_API }}" >> .env
            echo "GIPHY_API=${{ secrets.GIPHY_API }}" >> .env
            echo "HERO_API=${{ secrets.HERO_API }}" >> .env
            echo "SPOONACULAR_API=${{ secrets.SPOONACULAR_API }}" >> .env
            echo "CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}" >> .env
            echo "ADMIN_ID=${{ secrets.ADMIN_ID }}" >> .env

            # 4. Docker-Image mit einem eigenen Dev-Tag bauen
            docker build -t baerchenbot-dev-image .

            # 5. Alten Dev-Container stoppen und löschen
            docker stop baerchenbot-dev-container || true
            docker rm baerchenbot-dev-container || true

            # 6. Neuen Dev-Container starten
            docker run -d \
              --name baerchenbot-dev-container \
              --network="host" \
              --restart unless-stopped \
              --env-file .env \
              baerchenbot-dev-image
